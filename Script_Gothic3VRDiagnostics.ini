[Diagnostics]
Enabled=1
; Camera/device samples, milliseconds. Accepted range: 100..60000.
SampleIntervalMs=1000
; Detailed entry/exit trace, in OnProcess updates. Accepted range: 1..600.
TraceFrames=120
AutoTrace=1
; Hard per-session JSONL file limit, MiB. Accepted range: 1..64.
MaxLogMiB=16

; While Gothic 3 is foreground:
; Ctrl+Shift+F6  = mark the log and request a camera/device snapshot
; Ctrl+Shift+F7 = capture another detailed trace

[Tracking]
Enabled=1
PollIntervalMs=11
SampleIntervalMs=100
RetryIntervalMs=5000

[HeadControl]
; AutoStart controls startup VR. Ctrl+Shift+F8 toggle; Ctrl+Shift+F11 recenter.
; Recenter after headset standby/tracking loss.
Allowed=1
MaxPoseAgeMs=50

[Locomotion]
; Direct horizontal velocity steering for ground movement.
; Horizontal head-directed movement while HMD control is active.
HeadDirected=1
RoomScaleWalking=1
InstantControllerTurn=1

[Stereo]
; Optional interaction comfort features. Launcher: Interaction / Third-person view.
